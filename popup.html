<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BrightTube</title>
  <style>
    body { margin: 0; padding: 12px 16px; width: 440px; font: 14px system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .coarse { display: flex; justify-content: space-between; }
    .coarse label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
    .fine-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .fine-row input { flex: 1; margin: 0; }
    .fine-row input:disabled { opacity: .4; }
    #fine-value { min-width: 3em; text-align: right; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <form id="form" class="coarse">
    <label><input type="radio" name="brightness" value="0"> 0%</label>
    <label><input type="radio" name="brightness" value="10"> 10%</label>
    <label><input type="radio" name="brightness" value="20"> 20%</label>
    <label><input type="radio" name="brightness" value="30"> 30%</label>
    <label><input type="radio" name="brightness" value="40"> 40%</label>
    <label><input type="radio" name="brightness" value="50"> 50%</label>
    <label><input type="radio" name="brightness" value="60"> 60%</label>
    <label><input type="radio" name="brightness" value="70"> 70%</label>
    <label><input type="radio" name="brightness" value="80"> 80%</label>
    <label><input type="radio" name="brightness" value="90"> 90%</label>
    <label><input type="radio" name="brightness" value="100"> 100%</label>
  </form>
  <div class="fine-row">
    <span id="fine-title"></span>
    <input type="range" id="fine" min="0" max="9" step="1" value="0">
    <span id="fine-value">+0%</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
